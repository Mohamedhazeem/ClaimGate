name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Hermes release the plugin is developed and gated against: v0.23.1 is
  # the current Hermes release and satisfies the plugin's
  # ``requires_hermes: ">=0.23.0"`` floor. Bumping it is a deliberate change:
  # the authoritative admission gate is the catalog CI in hermes-agent, which
  # always runs against the current Hermes release.
  HERMES_TAG: v0.23.1

jobs:
  tests:
    name: Tests (no Hermes host required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Byte-compile the runtime package
        run: python -m compileall -q src

      # The host-dependent checks skip themselves when no Hermes checkout is
      # present. The domain, policy, hashing, and date contracts always run.
      - name: Run the test suite
        run: python -m unittest discover -s tests -v

      - name: Reject compiled payloads in the plugin tree
        run: |
          if git ls-files | grep -Ei '\.(pyc|pyo|so|dylib|dll|exe|wasm)$'; then
            echo "::error::a catalog plugin must not ship compiled payloads (rule 17)"
            exit 1
          fi

  hosted:
    # The `env` context is not available in a job name, so the pinned Hermes
    # release is reported by a step instead.
    name: Tests and catalog gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Report the pinned Hermes release
        run: |
          echo "Hermes release under test: $HERMES_TAG"

      - name: Check out the Hermes host
        run: |
          git clone --depth 1 --branch "$HERMES_TAG" \
            https://github.com/NousResearch/hermes-agent.git \
            "${{ runner.temp }}/hermes-agent"

      # Hermes' own dev-environment entry point. It stages the pinned uv from
      # pm/lock.json and builds the dependency environment Hermes commits for
      # a checkout. A pip install of the same tag does not work: that release
      # pins pillow==13.0.0 while its own browser-harness requires
      # pillow==12.3.0, so the resolution is unsatisfiable. pm resolves the
      # environment from the lockfile instead.
      - name: Prepare the Hermes runtime
        working-directory: ${{ runner.temp }}/hermes-agent
        run: bash setup-hermes.sh --runtime-only

      # With the Hermes host on the path, every check runs: nothing is skipped.
      - name: Run the full test suite
        run: >-
          ${{ runner.temp }}/hermes-agent/scripts/run-in-hermes-env
          python -m unittest discover -s tests -v

      - name: hermes plugins validate
        run: >-
          ${{ runner.temp }}/hermes-agent/scripts/run-in-hermes-env
          hermes plugins validate . --install-deps

      - name: hermes plugins doctor
        run: >-
          ${{ runner.temp }}/hermes-agent/scripts/run-in-hermes-env
          hermes plugins doctor . --ci
