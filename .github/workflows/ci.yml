name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Hermes release the plugin is developed and gated against. This is the
  # CalVer tag of Hermes 0.23.1, which satisfies the plugin's
  # ``requires_hermes: ">=0.23.0"`` floor. Bumping it is a deliberate change:
  # the authoritative admission gate is the catalog CI in hermes-agent, which
  # always runs against the current Hermes release.
  HERMES_TAG: v2026.9.24

jobs:
  tests:
    name: Tests (no Hermes host required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Byte-compile the runtime package
        run: python -m compileall -q src

      # The host-dependent checks skip themselves when no Hermes checkout is
      # present. The domain, policy, hashing, and date contracts always run.
      - name: Run the test suite
        run: python -m unittest discover -s tests -v

      - name: Reject compiled payloads in the plugin tree
        run: |
          if git ls-files | grep -Ei '\.(pyc|pyo|so|dylib|dll|exe|wasm)$'; then
            echo "::error::a catalog plugin must not ship compiled payloads (rule 17)"
            exit 1
          fi

  hosted:
    name: Tests and catalog gate (Hermes ${{ env.HERMES_TAG }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Hermes pins its runtime dependencies to Python 3.14.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Check out the Hermes host
        run: |
          git clone --depth 1 --branch "$HERMES_TAG" \
            https://github.com/NousResearch/hermes-agent.git \
            "${{ runner.temp }}/hermes-agent"

      - name: Install Hermes
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ runner.temp }}/hermes-agent"

      # With a host on the path, every check runs: nothing is skipped.
      - name: Run the full test suite
        env:
          HERMES_AGENT: ${{ runner.temp }}/hermes-agent
          PYTHONPATH: ${{ runner.temp }}/hermes-agent
        run: python -m unittest discover -s tests -v

      - name: hermes plugins validate
        env:
          HERMES_AGENT: ${{ runner.temp }}/hermes-agent
          PYTHONPATH: ${{ runner.temp }}/hermes-agent
        run: hermes plugins validate . --install-deps

      - name: hermes plugins doctor
        env:
          HERMES_AGENT: ${{ runner.temp }}/hermes-agent
          PYTHONPATH: ${{ runner.temp }}/hermes-agent
        run: hermes plugins doctor . --ci
